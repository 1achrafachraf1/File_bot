<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FileBox</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <div class="logo">
            📦 FileBox
        </div>

        <div class="status">
            <span id="statusDot"></span>
            <span id="statusText">جاري الاتصال...</span>
        </div>
    </header>


    <main>

        <section class="hero">
            <h1>تحميل الملفات</h1>
            <p>
                جميع الملفات المتوفرة للتحميل
            </p>
        </section>


        <section class="toolbar">

            <div class="searchBox">
                🔎
                <input
                    type="text"
                    id="searchInput"
                    placeholder="البحث عن ملف..."
                >
            </div>

            <button id="refreshBtn">
                🔄 تحديث
            </button>

        </section>


        <section>

            <div id="loading" class="loading">
                جاري تحميل الملفات...
            </div>

            <div id="empty" class="empty hidden">
                <div class="emptyIcon">📂</div>
                <h2>لا توجد ملفات</h2>
                <p>لم يتم العثور على أي ملفات حالياً.</p>
            </div>

            <div id="filesContainer" class="filesGrid"></div>

        </section>

    </main>


    <footer>
        <p>FileBox © 2026</p>
    </footer>


    <script src="config.js"></script>
    <script src="script.js"></script>

</body>
</html>
